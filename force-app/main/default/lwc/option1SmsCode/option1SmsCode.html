<template>
    <div class="slds-box slds-p-around_medium">
        <h2 class="slds-text-heading_medium slds-m-bottom_x-small">Enter your code</h2>
        <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_medium">
            A 6-digit code was sent to <strong>{maskedPhone}</strong>. It expires in 5 minutes.
        </p>

        <template if:true={dispatchError}>
            <div class="slds-notify slds-notify_alert slds-theme_error slds-m-bottom_medium" role="alert">
                <span class="slds-assistive-text">error</span>
                <span>{dispatchError}</span>
            </div>
        </template>

        <template if:true={sending}>
            <lightning-spinner alternative-text="Sending code" size="small"></lightning-spinner>
        </template>

        <lightning-input
            type="text"
            label="Verification code"
            value={code}
            onchange={handleCodeChange}
            max-length="6"
            pattern="[0-9]{6}"
            message-when-pattern-mismatch="Enter the 6-digit code"
            class="slds-m-bottom_medium">
        </lightning-input>

        <lightning-button
            variant="brand"
            label="Verify code"
            onclick={handleVerify}
            disabled={verifyDisabled}
            stretch
            class="slds-m-bottom_x-small">
        </lightning-button>

        <div class="slds-grid slds-grid_align-spread slds-m-top_small">
            <lightning-button variant="base" label="Resend code" onclick={handleResend} disabled={sending}></lightning-button>
            <lightning-button variant="base" label="Use a different option" onclick={handleSwitch}></lightning-button>
        </div>
    </div>
</template>
