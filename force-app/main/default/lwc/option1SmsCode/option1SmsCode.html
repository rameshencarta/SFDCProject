<template>
    <div class="slds-box slds-p-around_medium">
        <h2 class="slds-text-heading_medium slds-m-bottom_x-small">{labels.title}</h2>
        <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_medium">
            {introBefore}<strong>{maskedPhone}</strong>{introAfter}
        </p>

        <template if:true={dispatchError}>
            <div class="slds-notify slds-notify_alert slds-theme_error slds-m-bottom_medium" role="alert">
                <span class="slds-assistive-text">error</span>
                <span>{dispatchError}</span>
            </div>
        </template>

        <template if:true={sending}>
            <lightning-spinner alternative-text={labels.sending} size="small"></lightning-spinner>
        </template>

        <lightning-input
            type="text"
            label={labels.codeLabel}
            value={code}
            onchange={handleCodeChange}
            max-length="6"
            pattern="[0-9]{6}"
            message-when-pattern-mismatch={labels.codePattern}
            class="slds-m-bottom_medium">
        </lightning-input>

        <lightning-button
            variant="brand"
            label={labels.verifyCode}
            onclick={handleVerify}
            disabled={verifyDisabled}
            stretch
            class="slds-m-bottom_x-small">
        </lightning-button>

        <div class="slds-grid slds-grid_align-spread slds-m-top_small">
            <lightning-button variant="base" label={labels.resend} onclick={handleResend} disabled={sending}></lightning-button>
            <lightning-button variant="base" label={labels.chooseAnotherMethod} onclick={handleSwitch}></lightning-button>
        </div>
    </div>
</template>
