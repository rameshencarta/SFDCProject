<template>
    <div class="slds-box slds-p-around_medium">
        <h2 class="slds-text-heading_medium slds-m-bottom_medium">{labels.title}</h2>

        <template if:true={currentQuestion}>
            <div class="slds-box slds-box_x-small slds-theme_shade slds-m-bottom_medium">
                <p class="slds-text-body_small slds-text-color_weak">{labels.securityQuestions}</p>
                <p class="slds-text-heading_small">{currentQuestion.question}</p>
            </div>

            <lightning-input
                type="text"
                label={labels.answer}
                value={answerInput}
                onchange={handleAnswerChange}
                class="slds-m-bottom_medium">
            </lightning-input>

            <lightning-button
                variant="brand"
                label={labels.verify}
                onclick={handleVerify}
                disabled={isInvalid}
                stretch
                class="slds-m-bottom_x-small">
            </lightning-button>

            <div class="slds-grid slds-grid_align-spread slds-m-top_small">
                <lightning-button variant="base" label={labels.useDifferentQuestion} onclick={handleSwap}></lightning-button>
                <lightning-button variant="base" label={labels.chooseAnotherMethod} onclick={handleSwitch}></lightning-button>
            </div>
        </template>
    </div>
</template>
