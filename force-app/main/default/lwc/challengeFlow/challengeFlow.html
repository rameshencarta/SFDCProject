<template>
    <!-- ==================== LOADING STATE ==================== -->
    <template if:true={isLoading}>
        <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
    </template>

    <!-- ==================== ENTRY SCREEN ==================== -->
    <template if:true={showEntryScreen}>
        <div class="challenge-container">
            <div class="challenge-card">
                <div class="card-header">
                    <span class="screen-label">
                        Step {currentStepDisplay} of {totalSteps}
                    </span>
                    <span class="option-badge">{currentMethodLabel}</span>
                </div>

                <!-- Option step indicator -->
                <div class="progress-bar-container">
                    <template for:each={optionStepSegments} for:item="seg">
                        <div key={seg.key} class={seg.className}></div>
                    </template>
                </div>

                <div class="card-body">
                    <h1 class="card-title">We need to confirm it's you.</h1>
                    <p class="card-description">
                        Your existing record has been located. Please complete the
                        verification below to merge it with this application.
                    </p>

                    <div class="info-box">
                        <div class="info-label">Existing record</div>
                        <div class="info-value">{existingRecordLabel}</div>
                    </div>

                    <!-- Error from previous option failure -->
                    <template if:true={errorMessage}>
                        <div class="error-banner">
                            <lightning-icon icon-name="utility:error" size="x-small"
                                variant="error" class="error-icon"></lightning-icon>
                            <span>{errorMessage}</span>
                        </div>
                    </template>

                    <button class="btn btn-primary btn-full" onclick={handleStartVerification}>
                        Start verification
                    </button>
                    <div class="attempts-hint">{maxAttempts} attempts per method</div>

                    <!-- Available methods list -->
                    <div class="methods-footer">
                        <div class="methods-label">Available verification methods</div>
                        <div class="methods-list">
                            <template for:each={availableMethodsList} for:item="m">
                                <span key={m.key} class={m.className}>{m.label}</span>
                            </template>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <!-- ==================== OPTION 1: SECURITY QUESTIONS ==================== -->
    <template if:true={showOption1Screen}>
        <div class="challenge-container">
            <div class="challenge-card">
                <div class="card-header">
                    <span class="screen-label">
                        Question {currentQuestionDisplay} of {totalQuestions}
                    </span>
                    <span class="attempt-label">attempt {currentAttempt}/{maxAttempts}</span>
                </div>

                <!-- Question progress bar -->
                <div class="progress-bar-container">
                    <template for:each={questionProgressSegments} for:item="seg">
                        <div key={seg.key} class={seg.className}></div>
                    </template>
                </div>

                <div class="card-body">
                    <div class="panel-header">
                        <lightning-icon icon-name="utility:lock" size="x-small"
                            class="panel-icon"></lightning-icon>
                        <h2 class="panel-title">Security questions</h2>
                    </div>
                    <p class="card-description">
                        Answer the questions you set when you first registered.
                        Answers are not case-sensitive.
                    </p>

                    <div class="question-text">{currentQuestionText}</div>

                    <lightning-input
                        type="text"
                        label="Answer"
                        placeholder="Enter answer"
                        value={currentAnswer}
                        onchange={handleAnswerChange}
                        class="answer-input"
                        autocomplete="off"
                    ></lightning-input>

                    <!-- Error message -->
                    <template if:true={errorMessage}>
                        <div class="error-banner">
                            <lightning-icon icon-name="utility:error" size="x-small"
                                variant="error" class="error-icon"></lightning-icon>
                            <span>{errorMessage}</span>
                        </div>
                    </template>

                    <div class="button-row">
                        <button class="btn btn-secondary" onclick={handleBack}
                            disabled={isFirstQuestion}>
                            Back
                        </button>
                        <template if:false={isLastQuestion}>
                            <button class="btn btn-primary" onclick={handleNext}
                                disabled={isAnswerEmpty}>
                                Next
                            </button>
                        </template>
                        <template if:true={isLastQuestion}>
                            <button class="btn btn-primary" onclick={handleSubmitOption1}
                                disabled={isAnswerEmpty}>
                                {submitButtonLabel}
                            </button>
                        </template>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <!-- ==================== OPTION 2: PERSONAL IDENTIFIERS ==================== -->
    <template if:true={showOption2Screen}>
        <div class="challenge-container">
            <div class="challenge-card">
                <div class="card-header">
                    <span class="screen-label">
                        Step {currentStepDisplay} of {totalSteps} &mdash; Personal information
                    </span>
                    <span class="attempt-label">attempt {currentAttempt}/{maxAttempts}</span>
                </div>

                <div class="progress-bar-container">
                    <template for:each={optionStepSegments} for:item="seg">
                        <div key={seg.key} class={seg.className}></div>
                    </template>
                </div>

                <div class="card-body">
                    <div class="panel-header">
                        <lightning-icon icon-name="utility:identity" size="x-small"
                            class="panel-icon"></lightning-icon>
                        <h2 class="panel-title">Personal information</h2>
                    </div>
                    <p class="card-description">
                        Enter the information exactly as it appears on your
                        government-issued documents.
                    </p>

                    <!-- Error message -->
                    <template if:true={errorMessage}>
                        <div class="error-banner">
                            <lightning-icon icon-name="utility:error" size="x-small"
                                variant="error" class="error-icon"></lightning-icon>
                            <span>{errorMessage}</span>
                        </div>
                    </template>

                    <div class="form-grid">
                        <lightning-input
                            type="date"
                            label="Date of birth"
                            value={opt2Dob}
                            onchange={handleOpt2DobChange}
                            class="form-field"
                        ></lightning-input>
                        <lightning-input
                            type="tel"
                            label="Phone number"
                            placeholder="(###) ###-####"
                            value={opt2Phone}
                            onchange={handleOpt2PhoneChange}
                            class="form-field"
                        ></lightning-input>
                        <lightning-input
                            type="text"
                            label="Last name"
                            value={opt2LastName}
                            onchange={handleOpt2LastNameChange}
                            class="form-field"
                        ></lightning-input>
                        <lightning-input
                            type="text"
                            label="City of birth"
                            value={opt2CityBirth}
                            onchange={handleOpt2CityBirthChange}
                            class="form-field"
                        ></lightning-input>
                    </div>

                    <div class="submit-row">
                        <span class="encrypted-hint">Encrypted submission</span>
                        <button class="btn btn-primary" onclick={handleSubmitOption2}
                            disabled={isOpt2SubmitDisabled}>
                            {submitButtonLabel}
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <!-- ==================== OPTION 3: SERVICE NUMBER ==================== -->
    <template if:true={showOption3Screen}>
        <div class="challenge-container">
            <div class="challenge-card">
                <div class="card-header">
                    <span class="screen-label">
                        Step {currentStepDisplay} of {totalSteps} &mdash; Service number
                    </span>
                    <span class="attempt-label">attempt {currentAttempt}/{maxAttempts}</span>
                </div>

                <div class="progress-bar-container">
                    <template for:each={optionStepSegments} for:item="seg">
                        <div key={seg.key} class={seg.className}></div>
                    </template>
                </div>

                <div class="card-body">
                    <div class="panel-header">
                        <lightning-icon icon-name="utility:lock" size="x-small"
                            class="panel-icon"></lightning-icon>
                        <h2 class="panel-title">Service number</h2>
                    </div>
                    <p class="card-description">
                        Enter the service number issued during your previous service.
                    </p>

                    <!-- Error message -->
                    <template if:true={errorMessage}>
                        <div class="error-banner">
                            <lightning-icon icon-name="utility:error" size="x-small"
                                variant="error" class="error-icon"></lightning-icon>
                            <span>{errorMessage}</span>
                        </div>
                    </template>

                    <lightning-input
                        type="text"
                        label="Service number"
                        value={opt3ServiceNb}
                        onchange={handleOpt3ServiceNbChange}
                        class="answer-input mono-input"
                    ></lightning-input>

                    <div class="submit-row">
                        <span class="encrypted-hint">Encrypted submission</span>
                        <button class="btn btn-primary" onclick={handleSubmitOption3}
                            disabled={isOpt3SubmitDisabled}>
                            {submitButtonLabel}
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <!-- ==================== OPTION 4: APPLICANT DATA ==================== -->
    <template if:true={showOption4Screen}>
        <div class="challenge-container">
            <div class="challenge-card">
                <div class="card-header">
                    <span class="screen-label">
                        Step {currentStepDisplay} of {totalSteps} &mdash; Applicant details
                    </span>
                    <span class="attempt-label">attempt {currentAttempt}/{maxAttempts}</span>
                </div>

                <div class="progress-bar-container">
                    <template for:each={optionStepSegments} for:item="seg">
                        <div key={seg.key} class={seg.className}></div>
                    </template>
                </div>

                <div class="card-body">
                    <div class="panel-header">
                        <lightning-icon icon-name="utility:identity" size="x-small"
                            class="panel-icon"></lightning-icon>
                        <h2 class="panel-title">Applicant details</h2>
                    </div>
                    <p class="card-description">
                        Enter the given name and reference number associated with
                        your existing application.
                    </p>

                    <!-- Error message -->
                    <template if:true={errorMessage}>
                        <div class="error-banner">
                            <lightning-icon icon-name="utility:error" size="x-small"
                                variant="error" class="error-icon"></lightning-icon>
                            <span>{errorMessage}</span>
                        </div>
                    </template>

                    <div class="form-grid">
                        <lightning-input
                            type="text"
                            label="Given name"
                            value={opt4GivenName}
                            onchange={handleOpt4GivenNameChange}
                            class="form-field"
                        ></lightning-input>
                        <lightning-input
                            type="text"
                            label="Alpha number"
                            placeholder="e.g. A123456"
                            value={opt4AlphaNb}
                            onchange={handleOpt4AlphaNbChange}
                            class="form-field mono-input"
                        ></lightning-input>
                    </div>

                    <div class="submit-row">
                        <span class="encrypted-hint">Encrypted submission</span>
                        <button class="btn btn-primary" onclick={handleSubmitOption4}
                            disabled={isOpt4SubmitDisabled}>
                            {submitButtonLabel}
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <!-- ==================== SUCCESS ==================== -->
    <template if:true={showSuccessScreen}>
        <div class="challenge-container">
            <div class="challenge-card">
                <div class="card-header">
                    <span class="screen-label">Verification complete</span>
                    <span class="verified-badge">verified</span>
                </div>
                <div class="card-body">
                    <div class="success-header">
                        <lightning-icon icon-name="action:approval" size="small"
                            class="success-icon"></lightning-icon>
                        <h1 class="card-title inline-title">Identity verified</h1>
                    </div>
                    <p class="card-description">
                        Records merged. Routing you based on application status.
                    </p>

                    <div class="info-box">
                        <div class="info-row">
                            <span class="info-key">application_completed</span>
                            <span class="info-val">{applicationCompletedDisplay}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-key">next</span>
                            <span class="info-val">{nextRouteLabel}</span>
                        </div>
                    </div>

                    <button class="btn btn-success btn-full" onclick={handleContinue}>
                        Continue to {nextRouteLabel}
                    </button>
                </div>
            </div>
        </div>
    </template>

    <!-- ==================== ESCALATION ==================== -->
    <template if:true={showEscalationScreen}>
        <div class="challenge-container">
            <div class="challenge-card">
                <div class="card-header">
                    <span class="screen-label">Manual review required</span>
                    <span class="escalation-badge">escalation</span>
                </div>
                <div class="card-body">
                    <div class="escalation-header">
                        <lightning-icon icon-name="utility:warning" size="small"
                            variant="error" class="escalation-icon"></lightning-icon>
                        <h1 class="card-title inline-title">Please contact a recruiter.</h1>
                    </div>
                    <p class="card-description">
                        We were unable to verify your identity automatically. A
                        Canadian Forces Recruiting Group (CFRG) representative will
                        help you complete the merge in person or by phone.
                    </p>

                    <div class="info-box">
                        <div class="info-row">
                            <span class="info-key">Phone</span>
                            <span class="info-val">1-800-856-8488</span>
                        </div>
                        <div class="info-row">
                            <span class="info-key">Reference</span>
                            <span class="info-val">{alphaNumber}</span>
                        </div>
                    </div>

                    <button class="btn btn-secondary btn-full" onclick={handleFindRecruiter}>
                        Find a recruiter
                    </button>
                </div>
            </div>
        </div>
    </template>

    <!-- ==================== DIRECT ROUTE (no challenge needed) ==================== -->
    <template if:true={showDirectRoute}>
        <div class="challenge-container">
            <div class="challenge-card">
                <div class="card-body">
                    <div class="success-header">
                        <lightning-icon icon-name="action:approval" size="small"
                            class="success-icon"></lightning-icon>
                        <h1 class="card-title inline-title">Welcome back</h1>
                    </div>
                    <p class="card-description">
                        No additional verification is required. Redirecting you.
                    </p>
                    <button class="btn btn-success btn-full" onclick={handleContinue}>
                        Continue to {nextRouteLabel}
                    </button>
                </div>
            </div>
        </div>
    </template>
</template>
